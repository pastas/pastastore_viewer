  <!-- Middle flowing curve -->
  <path d="M 2 12 Q 8 10 12 13 Q 16 16 22 12" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom flowing curve (rises up) -->
  <path d="M 2 20 Q 6 18 10 20 Q 14 22 18 18 Q 20 17 22 20" fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
