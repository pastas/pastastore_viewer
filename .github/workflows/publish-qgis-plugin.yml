name: Publish QGIS Plugin

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLUGIN_FOLDER: pastastore_viewer
      PLUGIN_PACKAGE_NAME: pastastore_viewer
      ZIP_NAME: pastastore_viewer.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bundle dependencies
        shell: bash
        run: |
          python bundle_deps.py

      - name: Build plugin zip
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p "build/${PLUGIN_FOLDER}"

          rsync -a ./ "build/${PLUGIN_FOLDER}/" \
            --exclude .git \
            --exclude .github \
            --exclude .gitignore \
            --exclude __pycache__ \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '*.DS_Store' \
            --exclude .venv \
            --exclude build \
            --exclude tests \
            --exclude license_server \
            --exclude licenses \
            --exclude bundle_deps.py \
            --exclude run_tests.py \
            --exclude pytest.ini \
            --exclude TESTING.md \
            --exclude requirements.txt \
            --exclude tests-requirements.txt


          (
            cd build
            zip -r "../${ZIP_NAME}" "${PLUGIN_FOLDER}"
          )

      - name: Upload to QGIS plugin repository (token)
        shell: bash
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${QGIS_PLUGIN_TOKEN:-}" ]]; then
            echo "Missing repository secret QGIS_PLUGIN_TOKEN" >&2
            exit 1
          fi

          if [[ ! -f "${ZIP_NAME}" ]]; then
            echo "Package not found: ${ZIP_NAME}" >&2
            exit 1
          fi

          api_url="https://plugins.qgis.org/plugins/api/${PLUGIN_PACKAGE_NAME}/version/add/"
          response_file="qgis-upload-response.json"

          http_code="$(curl -sS -o "${response_file}" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${QGIS_PLUGIN_TOKEN}" \
            -F "package=@${ZIP_NAME}" \
            "${api_url}")"

          if [[ "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "Upload completed successfully (HTTP ${http_code})."
            cat "${response_file}"
          else
            echo "Upload failed (HTTP ${http_code})." >&2
            cat "${response_file}" >&2
            exit 1
          fi
